services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: huertos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the environment}
    ports:
      - "${POSTGRES_PUBLISHED_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - huertos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d huertos_db && pg_isready -U postgres -d sensor_db"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  parcel-service:
    build:
      context: ./parcel-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/huertos_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the environment}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - huertos-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

  sensor-service:
    build:
      context: ./sensor-service
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sensor_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in the environment}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PARCEL_SERVICE_URL: http://parcel-service:8081
      PARCEL_SERVICE_CONNECT_TIMEOUT: 2s
      PARCEL_SERVICE_READ_TIMEOUT: 3s
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      parcel-service:
        condition: service_healthy
    networks:
      - huertos-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  huertos-net:
    driver: bridge

volumes:
  postgres_data:
