spring.application.name=sensor-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sensor_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
services.parcel-service.base-url=${PARCEL_SERVICE_URL:http://localhost:8081}
services.parcel-service.connect-timeout=${PARCEL_SERVICE_CONNECT_TIMEOUT:2s}
services.parcel-service.read-timeout=${PARCEL_SERVICE_READ_TIMEOUT:3s}
